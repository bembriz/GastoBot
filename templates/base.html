<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos IA</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        :root {
            --bg: #f5f5f5;
            --card: #fff;
            --text: #222;
            --muted: #666;
            --border: #ddd;
            --primary: #2563eb;
            --danger: #dc2626;
            --success: #16a34a;
            --warn: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
        nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        nav .user { display: flex; gap: 12px; align-items: center; }
        nav a { color: var(--primary); text-decoration: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f9fafb; font-weight: 600; font-size: 13px; color: var(--muted); }
        .status { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .status-EN_COLA { background: #fef3c7; color: #92400e; }
        .status-ANALIZANDO { background: #dbeafe; color: #1e40af; }
        .status-LISTO_PARA_REVISION { background: #d1fae5; color: #065f46; }
        .status-REQUIERE_REVISION { background: #fee2e2; color: #991b1b; }
        .status-ENVIADO { background: #e0e7ff; color: #3730a3; }
        .status-ERROR { background: #fee2e2; color: #991b1b; }
        .status-ERROR_PROCESAMIENTO { background: #fee2e2; color: #991b1b; border: 2px dashed #dc3545; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        label { font-size: 13px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 4px; }
        .form-group { margin-bottom: 12px; }
        .flex { display: flex; gap: 12px; }
        .flex-col { flex-direction: column; }
        .flex-wrap { flex-wrap: wrap; }
        .w-half { width: calc(50% - 6px); }
        .img-viewer { max-width: 100%; max-height: 70vh; border-radius: 8px; }
        .img-controls { display: flex; gap: 8px; margin-bottom: 12px; }
        .login-box { max-width: 400px; margin: 80px auto; }
        .login-box h1 { text-align: center; margin-bottom: 24px; }
        .error { color: var(--danger); font-size: 13px; margin-top: 4px; }
        .warn-badge { background: var(--warn); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px; margin-left: 6px; }
        .poll-indicator { font-size: 11px; color: var(--muted); }
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }
        .row-selected { background: #eff6ff !important; }
        tr.row-selected td { background: transparent !important; }
    </style>
</head>
<body>
    {% if user %}
    <nav>
        <div>
            <a href="/dashboard" style="font-weight:700;font-size:18px;">Gastos IA</a>
        </div>
        <div class="user">
            <span>{{ user.username }} ({{ user.role }})</span>
            {% if user.role == 'admin' %}
            <a href="/catalogs">Catálogos</a>
            <a href="/history">Historial</a>
            {% endif %}
            <a href="/logout" style="color:var(--danger);">Salir</a>
        </div>
    </nav>
    {% endif %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
