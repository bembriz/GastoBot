[project]
name = "gastos-ia"
version = "0.1.0"
description = "Extraccion, revision y registro de gastos con IA multimodal local"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
    "gspread>=6.1.0",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
    "aiofiles>=24.1.0",
    "python-dateutil>=2.9.0",
    "openpyxl>=3.1.5",
    "google-genai>=1.0",
    "playwright>=1.61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-playwright>=0.5.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["harness", "scripts", "migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["e2e: End-to-end tests with Playwright"]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not e2e'"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 60
